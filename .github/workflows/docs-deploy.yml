name: Deploy GNSIS documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Coolify configuration
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DOCS_APPLICATION_UUID: ${{ secrets.COOLIFY_DOCS_APPLICATION_UUID }}
        run: |
          test -n "$COOLIFY_URL" || { echo "Missing COOLIFY_URL"; exit 1; }
          test -n "$COOLIFY_TOKEN" || { echo "Missing COOLIFY_TOKEN"; exit 1; }
          test -n "$COOLIFY_DOCS_APPLICATION_UUID" || { echo "Missing COOLIFY_DOCS_APPLICATION_UUID"; exit 1; }
      - name: Trigger Coolify deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DOCS_APPLICATION_UUID: ${{ secrets.COOLIFY_DOCS_APPLICATION_UUID }}
        run: |
          curl -fsS --retry 3 --retry-delay 2 -X POST "${COOLIFY_URL%/}/api/v1/deploy" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(printf '{"uuid":"%s","force":false}' "$COOLIFY_DOCS_APPLICATION_UUID")"
